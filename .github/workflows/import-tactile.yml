name: Publish verified Living Pixel World
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Workspace URL of the tested release bundle
        required: true
      sha256:
        description: SHA-256 of the approved bundle
        required: true
      expected_head:
        description: Stop if main changed after review
        required: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tested bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA: ${{ inputs.sha256 }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python - <<'PY'
          import os,hashlib,io,zipfile,pathlib,subprocess,urllib.request,re
          expected=os.environ['EXPECTED_HEAD']
          if not re.fullmatch('[0-9a-f]{40}',expected):raise RuntimeError('Invalid expected head')
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=expected:raise RuntimeError('Main advanced; review changes first')
          url=os.environ['BUNDLE_URL']
          if not url.startswith('https://'):raise RuntimeError('HTTPS required')
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'EchoesVerifiedImport/2.2'}),timeout=60) as r:data=r.read(25000001)
          if len(data)>25000000 or hashlib.sha256(data).hexdigest()!=os.environ['BUNDLE_SHA']:raise RuntimeError('Bundle size/hash mismatch')
          z=zipfile.ZipFile(io.BytesIO(data))
          if sum(f.file_size for f in z.infolist())>60000000:raise RuntimeError('Unpacked size limit')
          for e in z.infolist():
              p=pathlib.PurePosixPath(e.filename)
              if p.is_absolute() or '..' in p.parts or '.git' in p.parts or '.github' in p.parts or (e.external_attr>>16)&0o170000==0o120000:raise RuntimeError('Unexpected archive path')
          z.extractall('.')
          print('Tested archive hash verified')
          PY
      - name: Rebuild and verify the shared game
        working-directory: game
        run: |
          npm ci
          npm test
          npm run build
          node tools/verify-build.mjs
          npm audit --audit-level=high
      - name: Compare tested production bytes and release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          for p in Path('game/dist').rglob('*'):
              if p.is_file() and p.read_bytes()!=Path(p.relative_to('game/dist')).read_bytes():raise RuntimeError('Production mismatch: '+str(p))
          for name,sha in json.loads(Path('release/checksums.json').read_text()).items():
              p=Path('release')/name
              if hashlib.sha256(p.read_bytes()).hexdigest()!=sha:raise RuntimeError('Release artifact mismatch: '+name)
          with zipfile.ZipFile('release/Echoes-Living-Web-2.2.0.zip') as z:
              if z.testzip():raise RuntimeError('Invalid web archive')
          print('Production and standalone artifact checks passed')
          PY
      - name: Commit verified code and production assets
        env:
          BUNDLE_SHA: ${{ inputs.sha256 }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game.js styles.css sw.js manifest.webmanifest privacy.html assets licenses ASSET_CREDITS.md AUDIO_CREDITS.md COPYRIGHT.md LICENSE asset-manifest.json audio-manifest.json game README.md .nojekyll
          git commit -m 'Release Living Pixel World 2.2: original cast, localized lighting, material reactions and licensed voices' -m "Verified bundle SHA-256: $BUNDLE_SHA"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      - name: Publish tested game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish tested downloadable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.2.0 release/index.html release/Echoes-Living-Web-2.2.0.zip --target "$(git rev-parse HEAD)" --title 'Living Pixel World 2.2.0' --notes-file game/docs/LIVING_RELEASE.md
